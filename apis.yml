aid: glydways
name: Glydways
description: >-
  Glydways is an autonomous urban-transit company building on-demand,
  high-capacity mobility networks that combine small self-driving electric
  vehicles (Glydcars), an AI fleet-orchestration layer, and dedicated
  narrow guideways separated from regular road traffic. The system is
  designed to move up to 10,000 people per hour while cutting construction
  cost by roughly 90% and operating cost to about 30% of conventional
  transit, with launch projects underway in Atlanta, Contra Costa County,
  California, and at San Jose Airport. Backed by Khosla Ventures, Glydways
  was surfaced through the venture portfolio and added to the API Evangelist
  network. As an autonomous-transit infrastructure company it publishes a
  corporate and news presence but no public developer API, SDK, or
  documentation surface at this time.
